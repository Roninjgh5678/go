<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 页面背景 */
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 登录容器 */
        .login-container {
            background-color: #fff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* 登录标题 */
        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
        }

        /* 表单组 */
        .form-group {
            margin-bottom: 20px;
        }

        /* 标签样式 */
        .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        /* 输入框样式 */
        .form-group input {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        /* 输入框焦点样式 */
        .form-group input:focus {
            outline: none;
            border-color: #4096ff;
            box-shadow: 0 0 0 2px rgba(64, 150, 255, 0.1);
        }

        /* 记住密码/忘记密码行 */
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* 记住密码复选框 */
        .remember-checkbox {
            display: flex;
            align-items: center;
            color: #666;
        }

        .remember-checkbox input {
            margin-right: 6px;
            width: 16px;
            height: 16px;
        }

        /* 忘记密码链接 */
        .forgot-password {
            color: #4096ff;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            height: 48px;
            background-color: #4096ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #3385ff;
        }

        /* 注册入口 */
        .register-tip {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .register-tip a {
            color: #4096ff;
            text-decoration: none;
        }

        .register-tip a:hover {
            text-decoration: underline;
        }

        /* 错误提示 */
        .error-tip {
            color: #f56c6c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">chushi用户登录</h2>
        <form action="/doAddUser" method="post" >
            <!-- 用户名输入 -->
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" name="username" placeholder="请输入用户名">
                <div class="error-tip" id="usernameError">用户名不能为空</div>
            </div>

            <!-- 密码输入 -->
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" name="password" placeholder="请输入密码">
                <div class="error-tip" id="passwordError">密码不能为空</div>
            </div>


            <!-- 登录按钮 -->
            <button type="submit" class="login-btn">登录</button>

          
        </form>
    </div>

    <script>
    
    </script>
</body>
</html>
